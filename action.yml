name: 'Universal Frontend Asset Squeezer'
description: 'Finds and compresses JPG/PNG images in a repo or PR to reduce frontend payload size.'
author: 'Your Name'
branding:
  icon: 'zap'
  color: 'purple'

inputs:
  image-quality:
    description: 'Compression quality, 1-100 (higher = larger/better quality)'
    required: false
    default: '80'
  paths:
    description: 'Comma-separated glob-style folders to scan, relative to repo root'
    required: false
    default: '.'
  dry-run:
    description: 'If true, reports savings without modifying files'
    required: false
    default: 'false'

outputs:
  saved-bytes:
    description: 'Total bytes saved across all optimized images'
  images-optimized:
    description: 'Number of images that were optimized'

runs:
  using: 'node20'
  main: 'dist/index.js'
