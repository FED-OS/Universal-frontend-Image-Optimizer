name: Squeeze Images on PR

on:
  pull_request:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Run Universal Frontend Squeezer
        id: squeeze
        uses: your-username/universal-frontend-squeezer@v1
        with:
          image-quality: '75'
          paths: 'assets,public,src/images'

      - name: Report savings
        run: |
          echo "Saved ${{ steps.squeeze.outputs.saved-bytes }} bytes across ${{ steps.squeeze.outputs.images-optimized }} image(s)."

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: optimize images [skip ci]"
          git push
